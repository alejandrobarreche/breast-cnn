# Baseline with three convolutions per stage instead of two.
# Input [3, 256, 256] with channels PRE, EARLY, LATE (early fusion of the DCE phases).
in_channels: 3
kernel_size: 3
activation: relu  # relu | leaky_relu | elu | gelu
stages:
  - {channels: 8, convs: 3}
  - {channels: 16, convs: 3}
  - {channels: 32, convs: 3}
  - {channels: 64, convs: 3}
  - {channels: 128, convs: 3}
dropout: 0.3
