# Baseline on the whole field downsampled to 128 x 128 by 2 x 2 average pooling.
# Input [3, 256, 256] with channels PRE, EARLY, LATE (early fusion of the DCE phases).
in_channels: 3
kernel_size: 3
activation: relu  # relu | leaky_relu | elu | gelu
input_pool: 2
stages:
  - {channels: 8, convs: 2}
  - {channels: 16, convs: 2}
  - {channels: 32, convs: 2}
  - {channels: 64, convs: 2}
  - {channels: 128, convs: 2}
dropout: 0.3
