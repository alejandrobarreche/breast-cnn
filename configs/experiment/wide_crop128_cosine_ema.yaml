# @package _global_
# wide_crop128_slow with a cosine learning-rate schedule and an exponential moving average
# of the weights (decay 0.998 after a warm-up, about two epochs of updates). The cosine
# schedule needs the whole budget, so early stopping is disabled and the full curve is kept.
train:
  experiment: wide_crop128_cosine_ema
  weighted_loss: true
  model: configs/model/wide_crop128.yaml
  rotation_degrees: 15.0
  max_translation: 0.1
  scale_range: [0.9, 1.1]
  learning_rate: 0.0001
  lr_schedule: cosine
  ema_decay: 0.998
  early_stopping_patience: 40
