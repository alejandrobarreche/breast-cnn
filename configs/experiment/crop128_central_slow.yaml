# @package _global_
# crop128_slow trained on the 4 central slices of each patient (validation: all).
train:
  experiment: crop128_central_slow
  weighted_loss: true
  model: configs/model/crop128.yaml
  train_slices_per_patient: 4
  rotation_degrees: 15.0
  max_translation: 0.1
  scale_range: [0.9, 1.1]
  learning_rate: 0.0001
