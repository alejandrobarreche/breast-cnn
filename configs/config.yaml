defaults:
  - _self_

data:
  metadata_dir: metadata
  image_path_aliases:
    dataset: data
  expected_image_size: [256, 256]

audit:
  validation_fold: 0

download:
  base_url: https://storage.googleapis.com/usecasesf-breastdcedl-alumnos-8264/breastdcedl
  workers: 16
  timeout_seconds: 60

# Phase-1 inspection settings, not an approved training protocol.
pipeline:
  validation_fold: 0
  batch_size: 8
  num_workers: 0
  seed: 2026
  horizontal_flip_probability: 0.0
  report_path: artifacts/metrics/data_pipeline_check.json

eda:
  seed: 2026
  figures_dir: artifacts/figures
  report_path: artifacts/metrics/eda_train.json

# Training protocol shared by all experiments; each file in configs/experiment/
# fixes the name and the factor under study. Run with +experiment=<name>.
train:
  experiment: ???
  model: configs/model/baseline.yaml
  folds: [0, 1, 2, 3, 4]
  seed: 2026
  epochs: 40
  early_stopping_patience: 8
  # best: keep the epoch with best validation patient AUC, with early stopping.
  # last: train exactly `epochs` epochs and keep the last one (fixed-epoch protocol).
  epoch_selection: best
  batch_size: 32
  num_workers: 4
  optimizer: adamw  # adamw | sgd (momentum 0.9)
  learning_rate: 0.001
  weight_decay: 0.0001
  horizontal_flip_probability: 0.5
  rotation_degrees: 0.0
  max_translation: 0.0
  scale_range: [1.0, 1.0]
  weighted_loss: ???
  # slice: one BCE term per slice. patient: slice logits pooled per patient
  # (mean or max) and one BCE term per patient; batches then hold whole patients.
  loss_unit: slice
  patient_pooling: mean
  patients_per_batch: 3  # ~30 slices, close to batch_size
  label_smoothing: 0.0   # targets y(1 - e) + e/2 during training only
  # null: every slice. k: only the k central slices of each training patient
  # (validation always keeps every slice, as the patient evaluation requires).
  train_slices_per_patient: null
  threshold: 0.5
  runs_dir: runs
  # true: one model per pair of folds, trained on the other three and validated on both;
  # gives out-of-fold ensemble scores for the threshold of the final ensemble.
  nested: false

# Analysis of finished runs (notebooks/02_runs_analysis.ipynb); internal validation only.
analysis:
  runs_dir: runs
  figures_dir: artifacts/figures
  reference: crop128_slow
  bootstrap_resamples: 10000
  bootstrap_strata: [fold, cohort, label]
  confidence_level: 0.95
  seed: 2026
  # Final image-only model: its fold models are averaged on test after calibration.
  final_run: runs/20261018-1330_wide_crop128_fixed
  # Same protocol with nested: true. The calibration map and the threshold are fitted on its
  # out-of-fold ensemble scores, the same kind of score the final ensemble gives on test.
  nested_run: runs/20261024-1255_wide_crop128_nested
  min_specificity: 0.9
  calibration_report_path: artifacts/metrics/calibration_validation_patient.json
  # Same protocol per slice, for the web application (one slice per prediction).
  slice_calibration_report_path: artifacts/metrics/calibration_validation_slice.json
  # Web application model (outside Git) and its export report with checksum and parity.
  onnx_path: artifacts/models/ensemble.onnx
  onnx_report_path: artifacts/metrics/onnx_export.json
  onnx_parity_slices: 512
  # Single test evaluation (scripts/evaluate_test.py); existing outputs are never overwritten.
  test_report_path: artifacts/metrics/test_evaluation_patient.json
  test_predictions_path: artifacts/metrics/predictions_test_slice.csv
  # Threshold correction made after the test evaluation (scripts/evaluate_test.py --correction):
  # same test predictions, calibration and threshold from the nested run.
  corrected_test_report_path: artifacts/metrics/test_evaluation_patient_corrected.json
